<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Explore 50 synthetic endoscopy images created with StyleGAN2. These are AI-generated views, not real patient photographs.">
  <meta name="referrer" content="no-referrer">
  <title>This Endoscopy Does Not Exist</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a111c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2386b9ed' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2386b9ed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>This Endoscopy<br><span>Does Not Exist</span></h1>
      <p class="instruction">A different synthetic view on every refresh.</p>
    </header>
    <figure aria-busy="true">
      <div class="image-stage">
        <img id="endoscopy" width="512" height="512" alt="AI-generated endoscopic view." hidden>
        <div id="image-state" role="status" aria-live="polite">
          <span class="aperture" aria-hidden="true"></span>
          <p id="state-message">Loading an image…</p>
        </div>
      </div>
      <figcaption id="caption" aria-live="polite">AI-generated image</figcaption>
    </figure>
    <button id="next-image" type="button" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.8-1L20 9M4 15l2.1 3A7 7 0 0 0 17.9 17"/></svg>
      <span>New image</span>
    </button>
    <footer>
      <p>Created with <a href="https://github.com/NVlabs/stylegan2-ada-pytorch" target="_blank" rel="noopener noreferrer">StyleGAN2</a>.</p>
      <p>50 synthetic views · 512 × 512 pixels · FID 4.95</p>
      <p>AI-generated images, not real patient photographs.</p>
      <p>Inspired by <span>This Person Does Not Exist</span>.</p>
    </footer>
    <noscript><p class="noscript">Enable JavaScript to load a new synthetic image on every refresh.</p></noscript>
  </main>
</body>
</html>
